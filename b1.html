<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header id="main-header" class="sticky-header">
    <h1>Contact Page</h1>
</header>

<nav>
    <a href="#" class="nav-link">Home</a>
    <a href="#" class="nav-link">Services</a>
    <a href="#" class="nav-link">Contact</a>
</nav>

<main>

    <section class="contact-section">

        <h2>Get in touch with us by filling contact form below</h2>

        <form class="contact-form">

            <div class="form-row">
                <input type="text" placeholder="* Enter your full name">
                <input type="email" placeholder="* Enter your email address">
            </div>

            <div class="form-row">
                <input type="text" placeholder="Enter your subject" class="full-input">
            </div>

            <div class="form-row">
                <textarea placeholder="* Your message here..." class="full-input"></textarea>
            </div>

            <div class="form-row submit-row">
                <button class="btn-send">Send message</button>
                <span class="note">* Please fill all required form field, thanks!</span>
            </div>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 Contact Website</p>
</footer>

</body>
</html>
